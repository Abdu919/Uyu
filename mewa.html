<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriBalance – MEWA</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="theme-green">
    <div class="background-overlay"></div>
    <nav class="navbar">
        <div class="brand">AgriBalance | MEWA</div>
        <div>
            <span id="userName"></span>
            <button id="logoutBtn" class="btn-outline btn-sm">Logout</button>
        </div>
    </nav>

    <div class="container">
        <h1 class="mb-4">MEWA Coordination Panel</h1>

        <!-- Tabs -->
        <div class="tab-bar">
            <button class="tab-btn active" data-tab="forecasts">Production Status</button>
            <button class="tab-btn" data-tab="register">Register Farmer</button>
            <button class="tab-btn" data-tab="recommendations">Manual Recommendation</button>
        </div>

        <!-- Tab: Production Status -->
        <div id="tab-forecasts" class="tab-content active">
            <div class="grid-2">
                <div class="glass-card">
                    <h3 class="mb-3">National Production vs Demand</h3>
                    <div class="table-responsive">
                        <table class="glass-table" id="summaryTable">
                            <thead>
                                <tr>
                                    <th>Crop</th>
                                    <th>Total Forecast (T)</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
                <div class="glass-card flex-center">
                    <h3 class="mb-3">Market Analysis</h3>
                    <p class="text-muted mb-4">Run analysis to generate crop recommendations based on market data.</p>
                    <button id="runAnalysisBtn" class="btn-primary">Run Analysis</button>
                    <div id="analysisResult" class="mt-3 text-sm"></div>
                </div>
            </div>
        </div>

        <!-- Tab: Register Farmer -->
        <div id="tab-register" class="tab-content">
            <div class="glass-card" style="max-width: 600px; margin:0 auto;">
                <h3 class="mb-4">Register New Farmer</h3>
                <form id="registerFarmerForm">
                    <div class="grid-2">
                        <div class="input-group">
                            <label>Username</label>
                            <input type="text" name="username" class="glass-input" required>
                        </div>
                        <div class="input-group">
                            <label>Password</label>
                            <input type="password" name="password" class="glass-input" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Full Name</label>
                        <input type="text" name="full_name" class="glass-input" required>
                    </div>
                    <div class="grid-2">
                        <div class="input-group">
                            <label>Email</label>
                            <input type="email" name="email" class="glass-input" required>
                        </div>
                        <div class="input-group">
                            <label>Phone</label>
                            <input type="text" name="phone" class="glass-input">
                        </div>
                    </div>
                    <div class="grid-2">
                        <div class="input-group">
                            <label>Region</label>
                            <input type="text" name="region" class="glass-input" required>
                        </div>
                        <div class="input-group">
                            <label>Farm Size (ha)</label>
                            <input type="number" step="0.01" name="farm_size_hectares" class="glass-input" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary w-100 mt-3">Register Farmer</button>
                </form>
            </div>
        </div>

        <!-- Tab: Manual Recommendation -->
        <div id="tab-recommendations" class="tab-content">
            <div class="glass-card">
                <div class="header-action">
                    <h3>Create Manual Recommendation</h3>
                    <button class="btn-primary btn-sm" onclick="openManualRecModal()">+ New Recommendation</button>
                </div>
                <!-- Optionally list existing recommendations -->
            </div>
        </div>
    </div>

    <!-- Manual Recommendation Modal -->
    <div id="manualRecModal" class="modal-overlay hidden">
        <div class="glass-modal">
            <div class="modal-header">
                <h3>Create Manual Recommendation</h3>
                <button class="btn-close" onclick="closeManualRecModal()">&times;</button>
            </div>
            <form id="manualRecForm" class="modal-body">
                <!-- Target type selection -->
                <div class="input-group">
                    <label>Send to:</label>
                    <div style="display: flex; gap: 1rem;">
                        <label><input type="radio" name="target_type" value="single" checked> Specific Farmer</label>
                        <label><input type="radio" name="target_type" value="region"> All Farmers in Region</label>
                    </div>
                </div>

                <!-- Farmer dropdown (shown when "single" selected) -->
                <div id="farmer-select-group" class="input-group">
                    <label>Farmer</label>
                    <select name="farmer_id" id="farmerSelect" class="glass-input">
                        <option value="">-- Select Farmer --</option>
                    </select>
                </div>

                <!-- Region dropdown (shown when "region" selected) -->
                <div id="region-select-group" class="input-group hidden">
                    <label>Region</label>
                    <select name="region" id="regionSelect" class="glass-input">
                        <option value="">-- Select Region --</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Crop</label>
                    <select name="crop_id" id="cropSelect" class="glass-input" required></select>
                </div>
                <div class="input-group">
                    <label>Recommendation Text (Arabic)</label>
                    <textarea name="recommendation_text" rows="3" class="glass-input" required></textarea>
                </div>
                <div class="grid-2">
                    <div class="input-group">
                        <label>Priority</label>
                        <select name="priority_level" class="glass-input">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Based on Snapshot ID (optional)</label>
                        <input type="number" name="snapshot_id" class="glass-input" placeholder="Leave blank">
                    </div>
                </div>
                <button type="submit" class="btn-primary w-100 mt-3">Create Recommendation</button>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/mewa.js"></script>
</body>
</html>
