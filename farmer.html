<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <title>Farmer Dashboard</title>
            <link rel="stylesheet" href="css/style.css">
            </head>
            <body class="theme-green">
                <div class="background-overlay"></div>
                    <nav class="navbar">
                            <div class="brand">AgriBalance | Farmer</div>
                                    <div>
                                                <span id="userName"></span>
                                                            <button id="logoutBtn" class="btn-outline btn-sm">Logout</button>
                                                                    </div>
                                                                        </nav>

                                                                            <div class="container">
                                                                                    <div class="header-action">
                                                                                                <h1>Farmer Portal</h1>
                                                                                                            <button class="btn-primary" onclick="openForecastModal()">+ New Forecast</button>
                                                                                                                    </div>

                                                                                                                            <!-- Stats Cards -->
                                                                                                                                    <div class="grid-3">
                                                                                                                                                <div class="glass-card stat-card">
                                                                                                                                                                <h3>Active Crops</h3>
                                                                                                                                                                                <h2 id="activeCrops">0</h2>
                                                                                                                                                                                            </div>
                                                                                                                                                                                                        <div class="glass-card stat-card">
                                                                                                                                                                                                                        <h3>Total Expected Yield (T)</h3>
                                                                                                                                                                                                                                        <h2 id="totalYield">0</h2>
                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                <div class="glass-card stat-card">
                                                                                                                                                                                                                                                                                <h3>Farm Location</h3>
                                                                                                                                                                                                                                                                                                <h2 id="farmLocation">-</h2>
                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                            <!-- My Forecasts -->
                                                                                                                                                                                                                                                                                                                                    <div class="glass-card">
                                                                                                                                                                                                                                                                                                                                                <h3 class="mb-3">My Production Forecasts</h3>
                                                                                                                                                                                                                                                                                                                                                            <table class="glass-table" id="forecastsTable">
                                                                                                                                                                                                                                                                                                                                                                            <thead>
                                                                                                                                                                                                                                                                                                                                                                                                <tr><th>Crop</th><th>Yield (T)</th><th>Harvest Start</th><th>Harvest End</th><th>Status</th></tr>
                                                                                                                                                                                                                                                                                                                                                                                                                </thead>
                                                                                                                                                                                                                                                                                                                                                                                                                                <tbody></tbody>
                                                                                                                                                                                                                                                                                                                                                                                                                                            </table>
                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                            <!-- Recommendations -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="glass-card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <h3 class="mb-3">Crop Recommendations</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div id="recommendationsList"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <!-- Forecast Modal -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div id="forecastModal" class="modal-overlay hidden">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="glass-modal">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="modal-header">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <h3>Submit Production Forecast</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button class="btn-close" onclick="closeForecastModal()">&times;</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <form id="forecastForm" class="modal-body">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="input-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <label>Crop</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <select name="crop_id" id="cropSelect" class="glass-input" required></select>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="input-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label>Expected Yield (tons)</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="number" step="0.01" name="expected_yield_tons" class="glass-input" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="input-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <label>Harvest Start Date</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <input type="date" name="harvest_start_date" class="glass-input" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="input-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label>Harvest End Date</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="date" name="harvest_end_date" class="glass-input" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button type="submit" class="btn-primary w-100">Submit Forecast</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </form>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <script src="js/auth.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script src="js/farmer.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
