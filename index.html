<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>AgriBalance – Login</title>
                <!-- Fonts -->
                    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
                        <!-- CSS -->
                            <link rel="stylesheet" href="css/style.css">
                            </head>
                            <body>
                                <!-- Nature Background Overlay -->
                                    <div class="background-overlay"></div>

                                        <!-- Login Box -->
                                            <div class="login-box glass-panel">
                                                    <div class="text-center mb-4">
                                                                <!-- Optional logo -->
                                                                            <!-- <img src="img/logo.png" alt="AgriBalance Logo" style="height: 80px; margin-bottom: 1rem;"> -->
                                                                                        <h2 class="text-primary">AgriBalance</h2>
                                                                                                    <p class="text-muted">Sign in to your account</p>
                                                                                                            </div>

                                                                                                                    <form id="loginForm">
                                                                                                                                <div class="input-group">
                                                                                                                                                <label for="username">Username</label>
                                                                                                                                                                <input type="text" id="username" name="username" class="glass-input" required>
                                                                                                                                                                            </div>
                                                                                                                                                                                        <div class="input-group">
                                                                                                                                                                                                        <label for="password">Password</label>
                                                                                                                                                                                                                        <input type="password" id="password" name="password" class="glass-input" required>
                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                <div id="login-error" class="error-msg hidden"></div>
                                                                                                                                                                                                                                                            <button type="submit" class="btn-primary w-100">Login</button>
                                                                                                                                                                                                                                                                    </form>

                                                                                                                                                                                                                                                                            <!-- Demo Accounts (for quick testing) -->
                                                                                                                                                                                                                                                                                    <div class="demo-creds mt-4">
                                                                                                                                                                                                                                                                                                <p class="text-sm text-center"><strong>Demo Accounts (password: password):</strong></p>
                                                                                                                                                                                                                                                                                                            <div class="badges">
                                                                                                                                                                                                                                                                                                                            <span class="badge" onclick="fillLogin('admin', 'password')">admin</span>
                                                                                                                                                                                                                                                                                                                                            <span class="badge" onclick="fillLogin('mewa_riyadh', 'password')">mewa_riyadh</span>
                                                                                                                                                                                                                                                                                                                                                            <span class="badge" onclick="fillLogin('moc_riyadh', 'password')">moc_riyadh</span>
                                                                                                                                                                                                                                                                                                                                                                            <span class="badge" onclick="fillLogin('farmer1', 'password')">farmer1</span>
                                                                                                                                                                                                                                                                                                                                                                                            <span class="badge" onclick="fillLogin('importer1', 'password')">importer1</span>
                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                        <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                // Helper to fill login form with demo credentials
                                                                                                                                                                                                                                                                                                                                                                                                                                        function fillLogin(username, password) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('username').value = username;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById('password').value = password;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script src="js/auth.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
