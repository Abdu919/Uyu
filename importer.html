<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>AgriBalance – Importer</title>
                <link rel="stylesheet" href="css/style.css">
                </head>
                <body class="theme-blue">
                    <div class="background-overlay"></div>
                        <nav class="navbar">
                                <div class="brand">AgriBalance | Importer</div>
                                        <div>
                                                    <span id="userName"></span>
                                                                <button id="logoutBtn" class="btn-outline btn-sm">Logout</button>
                                                                        </div>
                                                                            </nav>

                                                                                <div class="container">
                                                                                        <div class="header-action">
                                                                                                    <h1>Importer Portal</h1>
                                                                                                                <button class="btn-primary" onclick="openApplyModal()">+ New Application</button>
                                                                                                                        </div>

                                                                                                                                <!-- Company Profile (optional) -->
                                                                                                                                        <div id="profileBanner" class="glass-card mb-4"></div>

                                                                                                                                                <!-- My Applications -->
                                                                                                                                                        <div class="glass-card">
                                                                                                                                                                    <h3 class="mb-3">My Import Applications</h3>
                                                                                                                                                                                <table class="glass-table" id="applicationsTable">
                                                                                                                                                                                                <thead>
                                                                                                                                                                                                                    <tr>
                                                                                                                                                                                                                                            <th>Crop</th>
                                                                                                                                                                                                                                                                    <th>Requested (T)</th>
                                                                                                                                                                                                                                                                                            <th>Arrival Date</th>
                                                                                                                                                                                                                                                                                                                    <th>Status</th>
                                                                                                                                                                                                                                                                                                                                            <th>Approved Qty</th>
                                                                                                                                                                                                                                                                                                                                                                    <th>Notes</th>
                                                                                                                                                                                                                                                                                                                                                                                        </tr>
                                                                                                                                                                                                                                                                                                                                                                                                        </thead>
                                                                                                                                                                                                                                                                                                                                                                                                                        <tbody></tbody>
                                                                                                                                                                                                                                                                                                                                                                                                                                    </table>
                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                    <!-- Apply Modal -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div id="applyModal" class="modal-overlay hidden">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="glass-modal">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="modal-header">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <h3>Submit Import Application</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button class="btn-close" onclick="closeApplyModal()">&times;</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <form id="applyForm" class="modal-body">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="input-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label>Crop</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <select name="crop_id" id="cropSelect" class="glass-input" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <option value="">Select Crop</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </select>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="input-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <label>Requested Quantity (tons)</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input type="number" step="0.01" name="requested_quantity_tons" class="glass-input" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="input-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <label>Expected Arrival Date</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <input type="date" name="arrival_date" class="glass-input" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="input-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <label>Notes (optional)</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <textarea name="notes" rows="3" class="glass-input"></textarea>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button type="submit" class="btn-primary w-100">Submit Application</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </form>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script src="js/auth.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script src="js/importer.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
